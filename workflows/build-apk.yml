name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar debug.keystore (requerido por build.gradle.kts)
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug,O=Despensa Virtual,C=ES"

      - name: Crear .env con la clave de Gemini
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Compilar APK de debug (sin gradlew, usando Gradle directo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Ejecutar assembleDebug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: despensa-virtual-debug-apk
          path: app/build/outputs/apk/debug/*.apk
